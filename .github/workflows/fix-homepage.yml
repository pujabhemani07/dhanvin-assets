name: Fix homepage content

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-homepage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply requested homepage changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Requested homepage hero/stat values.
          s = s.replace('data-count="10">0</span><span class="stat-suffix">Cr+', 'data-count="1">0</span><span class="stat-suffix">Cr+')
          s = s.replace('data-count="500">0</span><span class="stat-suffix">+', 'data-count="60">0</span><span class="stat-suffix">k+')
          s = s.replace('<strong>₹1 Cr+</strong><span>AUM</span>', '<strong>₹1 Cr+</strong><span>Assets Guided</span>')
          s = s.replace('<strong>500+</strong><span>Happy Families</span>', '<strong>60k+</strong><span>Happy Families</span>')

          # Hero CTA.
          s = s.replace('> Book Free Consultation</a><a href="#services" class="btn btn-outline btn-lg">Explore Services', '> Start Planning Today</a><a href="#services" class="btn btn-outline btn-lg">Explore Services')

          # CTA in the "Ready to Build Your Wealth?" section only.
          s = s.replace('<div class="cta-btns"><a href="contact.html" class="btn btn-gold btn-lg"><i class="fa-solid fa-calendar-check"></i> Book Free Consultation</a>', '<div class="cta-btns"><a href="contact.html" class="btn btn-gold btn-lg"><i class="fa-solid fa-calendar-check"></i> Request Your Financial Assessment</a>')

          # Remove only YouTube and LinkedIn icons from the footer social-links row.
          s = re.sub(r'<a href="#"><i class="fa-brands fa-youtube"></i></a>', '', s, flags=re.I)
          s = re.sub(r'<a href="#"><i class="fa-brands fa-linkedin-in"></i></a>', '', s, flags=re.I)

          # Footer HTML/contact details are owned by worker/index.js.
          # Do not rewrite footer markup here; this avoids reintroducing stale footer structure or email values.

          # Ensure the floating WhatsApp button uses 9920082826.
          s = s.replace('https://wa.me/919999999999', 'https://wa.me/919920082826')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit homepage source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Finalize homepage CTA and footer updates"
          git push
