name: Deploy Dhanvin Assets Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "wrangler.jsonc"
      - ".assetsignore"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:
 
permissions:
  contents: read

concurrency:
  group: dhanvin-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare deployment credentials
        id: credentials
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CF_API_TOKEN" || -z "$CF_ACCOUNT_ID" ]]; then
            echo "::error::Deployment blocked: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Actions repository secrets."
            exit 1
          else
            if [[ ! "$CF_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
              echo "::error::CLOUDFLARE_ACCOUNT_ID is present but malformed. Copy the 32-character Account ID from Cloudflare Dashboard > Workers & Pages > Overview (or Account details). Do not use an API token, zone ID, email, or account name."
              exit 1
            fi
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Worker to Cloudflare
        if: steps.credentials.outputs.available == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Smoke test production ticker and Market Insights API
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://www.dhanvinassets.com"

          echo "Checking production ticker endpoint..."
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors --max-time 20 \
            "$BASE_URL/api/ticker" -o /tmp/ticker.json
          jq -e '(.items | type == "array") and (.marketOpen | type == "boolean") and (.marketLabel | type == "string") and (.source | type == "string")' /tmp/ticker.json >/dev/null
          jq '{marketLabel, calendarVerified, dataFresh, dataStatus, source, itemCount:(.items|length)}' /tmp/ticker.json

          echo "Checking IndianAPI Market Insights endpoint..."
          market_code=$(curl --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors --max-time 25 \
            -o /tmp/market.json -w "%{http_code}" "$BASE_URL/api/market?section=trending")
          if [[ "$market_code" != "200" ]]; then
            if jq -e '.error == "not_configured"' /tmp/market.json >/dev/null 2>&1; then
              echo "::warning::Ticker API is healthy, but Market Insights is not configured. Add INDIANAPI_KEY as a Cloudflare Worker secret to enable /api/market."
              exit 0
            fi
            echo "::error::Market Insights endpoint returned HTTP $market_code. Check INDIANAPI_KEY, the IndianAPI plan, endpoint access, and API credits."
            cat /tmp/market.json
            exit 1
          fi
          jq -e '(.section == "trending") and (.data | type == "object")' /tmp/market.json >/dev/null
          echo "Production ticker and configured Market Insights smoke tests passed."
